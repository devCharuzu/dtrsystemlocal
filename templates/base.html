<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Form 48 DTR System{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="/static/css/style.css?v=2" rel="stylesheet" />
</head>
<body>

<nav class="app-nav">
  <a class="brand" href="/">
    <i class="bi bi-calendar-check-fill"></i>DTR System RO XIII
  </a>
  <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')">
    <i class="bi bi-list"></i>
  </button>
  <ul class="nav-links" id="main-nav">
    <li><a href="/employees/" id="nav-employees"><i class="bi bi-people"></i>Employees</a></li>
    <li><a href="/datlogs/"   id="nav-datlogs"><i class="bi bi-upload"></i>Upload DAT</a></li>
    <li><a href="/xlslogs/"   id="nav-xlslogs"><i class="bi bi-file-earmark-spreadsheet"></i>Import Excel</a></li>
    <li><a href="/dtr/"       id="nav-dtr"><i class="bi bi-table"></i>DTR Grid</a></li>
  </ul>
</nav>

<div class="page">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  (function() {
    const path = window.location.pathname;
    if (path.startsWith('/employees')) document.getElementById('nav-employees')?.classList.add('active');
    else if (path.startsWith('/datlogs'))  document.getElementById('nav-datlogs')?.classList.add('active');
    else if (path.startsWith('/xlslogs'))  document.getElementById('nav-xlslogs')?.classList.add('active');
    else if (path.startsWith('/dtr'))      document.getElementById('nav-dtr')?.classList.add('active');
  })();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
